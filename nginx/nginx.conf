# CSV Evidence Tracker — Nginx reverse proxy
# Routes: /api/* → FastAPI  |  /* → React SPA

upstream api_upstream {
    server api:8000;
}

upstream frontend_upstream {
    server frontend:80;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 10M;

    location = /health {
        proxy_pass         http://api_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    location /api/ {
        proxy_pass         http://api_upstream/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /docs {
        proxy_pass         http://api_upstream/docs;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    location /openapi.json {
        proxy_pass         http://api_upstream/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # The frontend container handles SPA fallback with try_files.
    location / {
        proxy_pass         http://frontend_upstream/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }
}
