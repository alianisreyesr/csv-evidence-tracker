services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: csv_tracker_api
    restart: unless-stopped
    environment:
      DATABASE_PATH: /app/data/csv_tracker.db
      DATA_DIR: /app/data
      ENVIRONMENT: production
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env (see .env.example)}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
    volumes:
      - csv_data:/app/data
    networks:
      - csv_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: csv_tracker_ui
    restart: unless-stopped
    networks:
      - csv_net
    depends_on:
      api:
        condition: service_healthy

  nginx:
    image: nginx:1.25-alpine
    container_name: csv_tracker_proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - csv_net
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  csv_data:

networks:
  csv_net:
    driver: bridge
