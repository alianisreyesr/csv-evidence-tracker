version: "3.9"

services:

  # ── FastAPI Backend ──────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: csv_tracker_api
    restart: unless-stopped
    environment:
      - DATABASE_URL=sqlite:////app/data/evidence.db
      - ENVIRONMENT=production
    volumes:
      - ./data:/app/data          # persist SQLite + seed CSVs
    networks:
      - csv_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── React Frontend ───────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: csv_tracker_ui
    restart: unless-stopped
    networks:
      - csv_net
    depends_on:
      api:
        condition: service_healthy

  # ── Nginx Reverse Proxy ──────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: csv_tracker_proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - csv_net
    depends_on:
      - api
      - frontend

networks:
  csv_net:
    driver: bridge

volumes:
  data:
