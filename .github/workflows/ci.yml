name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest-cov

      - name: Run backend tests with coverage
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ -v --cov=app --cov-report=term-missing --cov-fail-under=70 --tb=short

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend from lockfile
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

  compose-smoke:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build Compose services
        run: docker compose build

      - name: Start Compose stack
        run: docker compose up -d --wait --wait-timeout 120

      - name: Smoke test reverse proxy and API
        run: |
          curl --fail --silent --show-error http://127.0.0.1/ > /tmp/index.html
          grep -q '<div id="root"></div>' /tmp/index.html
          curl --fail --silent --show-error http://127.0.0.1/health | python -m json.tool
          curl --fail --silent --show-error http://127.0.0.1/api/summary | python -m json.tool
          curl --fail --silent --show-error http://127.0.0.1/api/phases | python -m json.tool
          curl --fail --silent --show-error http://127.0.0.1/api/test-cases | python -m json.tool
          curl --fail --silent --show-error http://127.0.0.1/api/deviations | python -m json.tool
          curl --fail --silent --show-error http://127.0.0.1/api/audit-log | python -m json.tool
          curl --fail --silent --show-error http://127.0.0.1/api/rtm | python -m json.tool

      - name: Show Compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop Compose stack
        if: always()
        run: docker compose down -v
