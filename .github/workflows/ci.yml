name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────
  # 1. BACKEND — lint + type-check + tests + coverage
  # ─────────────────────────────────────────────
  backend:
    name: Backend (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install production dependencies
        run: pip install -r requirements.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check app/ tests/

      - name: Type-check with mypy
        run: mypy app/ --ignore-missing-imports --no-error-summary
        continue-on-error: true   # advisory only — tighten over time

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=70 \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  # ─────────────────────────────────────────────
  # 2. FRONTEND — install + build
  # ─────────────────────────────────────────────
  frontend:
    name: Frontend (Node / Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (reproducible)
        working-directory: frontend
        run: npm ci

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

  # ─────────────────────────────────────────────
  # 3. DOCKER — compose build + health smoke test
  # ─────────────────────────────────────────────
  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create .env from example
        run: |
          cp .env.example .env 2>/dev/null || echo "SECRET_KEY=ci-test-secret-key-32chars-minimum" > .env
          echo "ACCESS_TOKEN_EXPIRE_MINUTES=60" >> .env

      - name: Build and start services
        run: docker compose up --build -d

      - name: Wait for API to become healthy
        run: |
          echo "Waiting for /health..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/health 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "API healthy after ${i}s"
              break
            fi
            sleep 2
          done
          curl -f http://localhost/health || (docker compose logs && exit 1)

      - name: Verify /health response fields
        run: |
          RESP=$(curl -s http://localhost/health)
          echo "$RESP"
          echo "$RESP" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          assert data['status'] == 'ok', f'Expected ok, got {data[\"status\"]}'
          assert 'version' in data, 'Missing version'
          assert 'timestamp' in data, 'Missing timestamp'
          assert 'db_status' in data, 'Missing db_status'
          print('All /health fields verified')
          "

      - name: Smoke test — Swagger docs accessible
        run: curl -f http://localhost/docs > /dev/null

      - name: Print logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down
