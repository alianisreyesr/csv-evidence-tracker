[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage defaults (can be overridden on CLI)
addopts =
    --tb=short
    -q

# Markers used in this project
markers =
    slow: marks tests as slow (deselect with -m 'not slow')
    integration: marks integration tests requiring a running DB
